# Repo safety scan - blocks the tricks used to hide malware in public repos.
# The job id "scan" is the status check name the main ruleset requires
# ("Repo safety scan / scan"). Don't rename it without updating the ruleset.
#
# Only plain shell commands, no third-party actions. Checkout is pinned to a commit SHA.
name: Repo safety scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---------- VS Code ----------
      - name: Block auto-run VS Code tasks
        run: |
          if [ -d .vscode ] && grep -rIn 'folderOpen' .vscode; then
            echo "::error::.vscode contains an auto-run (folderOpen) task"
            exit 1
          fi

      - name: Block scripts that run non-code files with node
        run: |
          pattern='node[[:space:]]+[^[:space:]"]*\.(ttf|otf|woff2?|png|jpe?g|gif|svg|ico)'
          targets=""
          [ -d .vscode ] && targets=".vscode"
          [ -f package.json ] && targets="$targets package.json"
          if [ -n "$targets" ] && grep -rInE "$pattern" $targets; then
            echo "::error::A script runs a non-code file with node"
            exit 1
          fi

      # ---------- Hidden payloads ----------
      - name: Verify font files are real fonts
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            case "$magic" in
              00010000|74727565|4f54544f|74746366|774f4646|774f4632) ;;
              *) echo "::error file=$f::not a real font file (magic bytes: $magic)"; bad=1 ;;
            esac
          done < <(find . -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttc' \) -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          exit $bad

      - name: Flag obfuscated or hidden code in config files
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if awk 'length($0) > 1000 { found=1 } END { exit !found }' "$f"; then
              echo "::error file=$f::line longer than 1000 characters"
              bad=1
            fi
            if grep -qE '_0x[0-9a-f]{4,}' "$f"; then
              echo "::error file=$f::obfuscator-style identifiers found"
              bad=1
            fi
          done < <(find . -type f \( -name '*.config.js' -o -name '*.config.cjs' -o -name '*.config.mjs' -o -name '*.config.ts' -o -name '.eslintrc.js' \) -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          exit $bad

      # ---------- npm supply chain ----------
      - name: Lockfile only downloads from the npm registry
        run: |
          [ -f package-lock.json ] || exit 0
          if grep -nE '"resolved": "' package-lock.json | grep -vE '"resolved": "https://registry\.npmjs\.org/'; then
            echo "::error file=package-lock.json::a package is downloaded from somewhere other than registry.npmjs.org"
            exit 1
          fi

      - name: No install scripts in package.json
        run: |
          [ -f package.json ] || exit 0
          if node -e '
            const s = require("./package.json").scripts || {};
            const hooks = ["preinstall", "install", "postinstall", "prepare", "prepublish"].filter((k) => k in s);
            if (hooks.length) { console.log(hooks.join(", ")); process.exit(1); }
          '; then exit 0; fi
          echo "::error file=package.json::install-time scripts are not allowed (they run on every npm install)"
          exit 1

      - name: npm install scripts stay disabled (.npmrc)
        run: |
          if ! grep -qxE 'ignore-scripts=true' .npmrc; then
            echo "::error file=.npmrc::.npmrc must keep ignore-scripts=true"
            exit 1
          fi

      # ---------- GitHub Actions ----------
      - name: Workflows are safe (pinned actions, no pull_request_target)
        run: |
          bad=0
          if grep -rnE '^\s*pull_request_target\s*:|^\s*on:.*pull_request_target' .github/workflows; then
            echo "::error::pull_request_target runs fork code with write access and secrets - not allowed"
            bad=1
          fi
          if grep -rnE '^\s*-?\s*uses:\s*[^.#[:space:]][^@[:space:]]*@' .github/workflows | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "::error::every action must be pinned to a full 40-character commit SHA"
            bad=1
          fi
          exit $bad
